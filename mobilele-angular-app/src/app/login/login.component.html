<div class="container login-container">
  <h2 class="login-title">Login</h2>

  <form method="POST" class="login-form">
    <div class="form-group">
      <label for="username" class="form-label">Username</label>
      <input id="username" name="username" type="text" minlength="2" maxlength="50"
             class="form-input" placeholder="Username" value="username" />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" minlength="2" maxlength="20"
             class="form-input" placeholder="Password" value="password" />
    </div>

    <p class="errors">Invalid username or password.</p>

    <div class="button-holder">
      <input type="submit" class="btn-submit" value="Submit Offer" />
    </div>
  </form>
</div>
