<div class="container register-container">
  <h2 class="register-title">Register User</h2>

  <form method="POST" class="register-form">

    <div class="row">
      <div class="form-group col-half">
        <label for="firstName" class="form-label">First Name</label>
        <input id="firstName" type="text" minlength="2" maxlength="20"
               class="form-input" placeholder="First name" />
        <p class="errors">First name is required.</p>
      </div>

      <div class="form-group col-half">
        <label for="lastName" class="form-label">Last Name</label>
        <input id="lastName" type="text" minlength="2" maxlength="20"
               class="form-input" placeholder="Last name" />
        <p class="errors">Last name is required.</p>
      </div>
    </div>

    <div class="row">
      <div class="form-group col-half">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" minlength="2" maxlength="20"
               class="form-input" placeholder="Username" />
        <p class="errors">Username is required.</p>
      </div>

      <div class="form-group col-half">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" minlength="2" maxlength="20"
               class="form-input" placeholder="Password" />
        <p class="errors">Password is required.</p>
      </div>
    </div>

    <div class="row">
      <div class="form-group col-half">
        <label for="repeatPassword" class="form-label">Repeat Password</label>
        <input id="repeatPassword" type="password" minlength="2" maxlength="20"
               class="form-input" placeholder="Repeat password" />
        <p class="errors">Repeat password is required.</p>
      </div>
    </div>

    <div class="button-holder">
      <input type="submit" class="btn-submit" value="Submit Registration" />
    </div>
  </form>
</div>
