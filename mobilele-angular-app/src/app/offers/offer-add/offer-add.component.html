<div class="offer-add-container">
  <h2 class="page-title">Create a Car Sale Offer</h2>

  <form method="POST" class="offer-form">
    <div class="form-row">
      <div class="form-group">
        <label for="model">Model</label>
        <select id="model">
          <option value="">- Select a model -</option>
          <optgroup label="Brand name">
            <option>Model</option>
          </optgroup>
        </select>
        <p class="form-error">Vehicle model is required.</p>
      </div>
      <div class="form-group">
        <label for="price">Price (€)</label>
        <input id="price" type="number" min="0" step="100" placeholder="Suggested price" />
        <p class="form-error">Suggested price is required.</p>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="engine">Engine Type</label>
        <select id="engine">
          <option value="">- Select engine type -</option>
          <option>Diesel</option>
          <option>Petrol</option>
          <option>Electric</option>
        </select>
        <p class="form-error">Engine type is required.</p>
      </div>
      <div class="form-group">
        <label for="transmission">Transmission</label>
        <select id="transmission">
          <option value="">- Select transmission -</option>
          <option>Manual</option>
          <option>Automatic</option>
        </select>
        <p class="form-error">Transmission type is required.</p>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="year">Manufacture Year</label>
        <input id="year" type="number" min="1900" max="2099" step="1" placeholder="e.g. 2020" />
        <p class="form-error">Manufacturing year is required.</p>
      </div>
      <div class="form-group">
        <label for="mileage">Mileage (km)</label>
        <input id="mileage" type="number" min="0" max="900000" step="1000" placeholder="e.g. 75000" />
        <p class="form-error">Mileage in kilometers is required.</p>
      </div>
    </div>

    <div class="form-group full-width">
      <label for="description">Description</label>
      <textarea id="description" rows="4" placeholder="Describe the vehicle..."></textarea>
      <p class="form-error">Description is required.</p>
    </div>

    <div class="form-group full-width">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" type="url" placeholder="https://example.com/car.jpg" />
      <p class="form-error">Vehicle image URL is required.</p>
    </div>

    <div class="submit-wrapper">
      <button type="submit" class="btn-submit">Submit Offer</button>
    </div>
  </form>
</div>
