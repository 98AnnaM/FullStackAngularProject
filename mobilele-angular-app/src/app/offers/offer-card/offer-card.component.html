<div class="offer-card-horizontal">
  <div class="image-wrapper-horizontal">
    <img [src]="offer.imageUrl" alt="Car image" />
  </div>
  <div class="offer-info-horizontal">
    <h3>{{ offer.year }} {{ offer.brandName }} {{ offer.modelName }}</h3>
    <ul>
      <li><strong>Mileage: </strong> {{ offer.mileage }} km</li>
      <li><strong>Price: </strong> €{{ offer.price }}</li>
      <li><strong>Engine:</strong> {{ offer.engine  | titlecase }}</li>
      <li><strong>Transmission:</strong> {{ offer.transmission  | titlecase }}</li>
    </ul>
    <a [routerLink]="['/offers', offer.id]" class="btn details-btn">View Details</a>
  </div>
</div>
