@if(isLoading) {
  <app-loader/>
}@else{
  <div class="all-offers-container">
    <h2 class="page-title">All Car Offers ({{totalElements}})</h2>

    <div class="offer-grid">

      <!-- Offer Cards -->
      @for (offer of offers; track $index) {
        <app-offer-card [offer]="offer"/>
      }

    </div>

    <app-pagination
      [page]="page"
      [totalPages]="totalPages"
      (pageChange)="loadOffers($event)">
    </app-pagination>

  </div>
}
