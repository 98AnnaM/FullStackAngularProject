@if(isLoading) {
  <app-loader/>
}@else{
  <div class="all-offers-container">
    <h2 class="page-title">All Car Offers</h2>

    <div class="offer-grid">

      <!-- Offer Cards -->
      @for (offer of offers; track $index) {
        <app-offer-card [offer]="offer"/>
      }

    </div>
  </div>
}
