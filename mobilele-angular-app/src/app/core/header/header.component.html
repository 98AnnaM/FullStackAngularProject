<div>
  <nav class="header-navbar">
    <a routerLink="/home" class="brand">
      <img src="/images/car.png" alt="car picture" class="logo">
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
      <span class="nav-toggle-icon"></span>
    </button>

    <div class="nav-menu" id="nav-menu">
      <ul class="nav-list">
        <li><a routerLink="/brands" class="nav-link">Brands</a></li>
        <li><a routerLink="/offers" class="nav-link">Offers</a></li>
        <li><a routerLink="/offers/search" class="nav-link">Search Offers</a></li>

        @if (isLogged) {
          <li><a routerLink="/offers/add" class="nav-link">Add Offer</a></li>
          <li>
            <div class="user-section">
              <span class="logged-user">Welcome, {{username}}</span>
              <a (click)="logout()" class="nav-link">Logout</a>
            </div>
          </li>
        } @else {
          <li><a routerLink="/users/register" class="nav-link">Register</a></li>
          <li><a routerLink="/users/login" class="nav-link">Login</a></li>
        }
      </ul>
    </div>
  </nav>
</div>
