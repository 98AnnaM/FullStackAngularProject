<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MobiLeLeLe</title>
    <link href="/css/reset-css.css" rel="stylesheet"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet" type="text/css"/>
    <script src="/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>

<body>

<div th:replace="fragments/navbar">Navbar</div>


<div class="container-fluid">
    <h2 class="text-center text-white mt-5">All Offers</h2>
    <div class="offers row mx-auto d-flex flex-row justify-content-center">
        <div class="offer card col-sm-12 col-md-6  col-lg-4 m-2 p-1" th:each="o : ${offers}" th:object="${o}">
            <div class="card-img-top-wrapper">
                <img alt="Car image" class="card-img-top" th:src="*{imageUrl}">
            </div>
            <div class="card-body pb-1" th:text="|Offer: *{id} Year: *{year} Brand: *{brandName} Model: *{modelName}|">
                Offer year Brand name Model name</h5>
            </div>
            <ul class="offer-details list-group list-group-flush">
                <li class="list-group-item">
                    <div class="card-text" th:text="|Milleage: *{mileage}|"><span>• Mileage</span></div>
                    <div class="card-text" th:text="|Price: *{price}|"><span>• Price</span></div>
                    <div class="card-text" th:text="|Engine type: *{engine}|"><span>• Engine type</span></div>
                    <div class="card-text" th:text="|Transmission type: *{transmission}|">
                        <span>• Transmission type</span></div>
                </li>
            </ul>
            <div class="card-body">
                <a class="card-link" href="#" th:href="@{/offers/{offerId}(offerId=*{id})}">Details</a>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid container-fluid row justify-content-center">
    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${offers.hasPrevious() ? '' : 'disabled'}">
                <a class="page-link"
                   href="#"
                   th:href="@{/offers/all(size=${offers.getSize()},page=${offers.getNumber() - 1})}"
                   th:if="${offers.hasPrevious()}">Previous</a>
                <a class="page-link"
                   href="#" th:unless="${offers.hasPrevious()}">Previous</a>
            <li th:classappend="${page == offers.getNumber() ? 'disabled' : ''}"
                th:each="page : ${#numbers.sequence(0, offers.getTotalPages()-1)}">
                <a class="page-link"
                   href="#"
                   th:href="@{/offers/all(size=${offers.getSize()},page=${page})}" th:text="${page + 1}"
                   th:unless="${page == offers.getNumber()}">Number</a>
                <span class="page-link" th:if="${page == offers.getNumber()}" th:text="${page + 1}">Number</span>
            </li>
            <li class="page-item" th:classappend="${offers.hasNext() ? '' : 'disabled'}">
                <a class="page-link"
                   href="#"
                   th:href="@{/offers/all(size=${offers.getSize()},page=${offers.getNumber() + 1})}"
                   th:if="${offers.hasNext()}">Next</a>
                <a class="page-link"
                   href="#" th:unless="${offers.hasNext()}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<div>
    <footer></footer>
</div>

</body>
</html>
