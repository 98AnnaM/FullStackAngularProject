<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>

<head>
    <meta charset="UTF-8">
    <title>MobiLeLeLe</title>
    <link href="/css/reset-css.css" rel="stylesheet"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet" type="text/css"/>
    <script src="/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>

<body>

<div th:replace="fragments/navbar">Navbar</div>


<div class="container-fluid">
    <h1 class="text-center text-white mt-5">Welcome to statistics!</h1>
    <h3 class="text-center text-white mt-5">Total requests:
        <th:block th:text="${stats.getTotalRequests()}"></th:block>
    </h3>
    <h3 class="text-center text-white mt-5">Anonymous requests:
        <th:block th:text="${stats.getAnonymousRequests()}"></th:block>
    </h3>
    <h3 class="text-center text-white mt-5">Authorized requests:
        <th:block th:text="${stats.getAuthRequests()}"></th:block>
    </h3>
</div>

<div>
    <footer></footer>
</div>

</body>
</html>
