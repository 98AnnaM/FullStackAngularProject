<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MobiLeLeLe</title>
    <link href="/css/reset-css.css" rel="stylesheet"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet" type="text/css"/>
    <script src="/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>

<body>

<div th:replace="fragments/navbar">Navbar</div>

<div class="container">
    <h2 class="text-center text-white">Register User</h2>
    <form
            class="main-form mx-auto col-md-8 d-flex flex-column justify-content-center"
            th:action="@{/users/register}"
            th:method="post"
            th:object="${userModel}">
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="firstName">First Name</label>
                <input class="form-control"
                       id="firstName"
                       placeholder="First name"
                       th:errorclass="is-invalid"
                       th:field="*{firstName}"
                       type="text"/>
                <p class="invalid-feedback errors alert alert-danger">
                    First name is required and should be between 2 and 20 symbols.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="lastName">Last Name</label>
                <input class="form-control"
                       id="lastName"
                       placeholder="Last name"
                       th:errorclass="is-invalid"
                       th:field="*{lastName}"
                       type="text"/>
                <p class="invalid-feedback errors alert alert-danger">
                    Last name is required and should be between 2 and 20 symbols.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="email">Email</label>
                <input class="form-control"
                       id="email"
                       placeholder="Email"
                       th:errorclass="is-invalid"
                       th:field="*{email}"
                       type="text"
                />
                <div class="invalid-feedback errors alert alert-danger">
                    <div
                            th:each="err : ${#fields.errors('email')}"
                            th:text="${err}"
                    />

                </div>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="password">Password</label>
                <input class="form-control"
                       id="password"
                       placeholder="Password"
                       th:errorclass="is-invalid"
                       th:field="*{password}"
                       type="password"
                />
                <p class="invalid-feedback errors alert alert-danger">
                    Password is required and should be at least 5 symbols.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="text-white font-weight-bold" for="confirmPassword">Confirm Password</label>
            <input class="form-control"
                   id="confirmPassword"
                   max="20"
                   min="2"
                   placeholder="Repeat Password"
                   th:errorclass="is-invalid"
                   th:field="*{confirmPassword}"
                   type="password"
            />
            <p class="invalid-feedback errors alert alert-danger">
                Passwords should match.
            </p>
        </div>

        <div class="row">
            <div class="col col-md-4">
                <div class="button-holder d-flex">
                    <input class="btn btn-info btn-lg" type="submit" value="Register"/>
                </div>
            </div>
        </div>
    </form>
</div>

<div>
    <footer></footer>
</div>

</body>
</html>
