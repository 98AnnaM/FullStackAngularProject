<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MobiLeLeLe</title>
    <link href="/css/reset-css.css" rel="stylesheet"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet" type="text/css"/>
    <script src="/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>

<body>

<div th:replace="fragments/navbar">Navbar</div>


<div class="container">
    <h2 class="text-center text-white">Update Offer</h2>
    <form
            class="main-form mx-auto col-md-8 d-flex flex-column justify-content-center"
            th:action="@{/offers/edit/{id}(id=*{id})}"
            th:method="put"
            th:object="${offer}">
        <div class="row">

            <div class="form-group col-md-6 mb-3">
                <label class="text-center text-white font-weight-bold" for="modelId">Model</label>
                <select class="form-control"
                        id="modelId"
                        th:errorclass="is-invalid"
                        th:field="*{modelId}">
                    <option value="">- Select a model -</option>
                    <optgroup
                            th:each="brand : ${brands}"
                            th:label="${brand.name}">
                        <option
                                th:each="model : ${brand.models}"
                                th:selected="${model.id} == *{modelId}"
                                th:text="${model.name}"
                                th:value="${model.id}">
                        </option>
                    </optgroup>
                </select>
                <p class="invalid-feedback errors alert alert-danger">
                    Vechicle model is required.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="price">Price</label>
                <input class="form-control"
                       id="price"
                       min="0"
                       placeholder="Suggested price"
                       step="100"
                       th:errorclass="is-invalid"
                       th:field="*{price}"
                       type="number"/>
                <p class="invalid-feedback errors alert alert-danger">
                    Suggested price is required.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label class="text-center text-white font-weight-bold" for="engine">Engine</label>
                <select
                        class="form-control"
                        id="engine"
                        th:errorclass="is-invalid"
                        th:field="*{engine}">
                    <option value="">- Select engine type -</option>
                    <option th:each="e : ${T(bg.softuni.mobilelele.model.enums.EngineEnum).values()}"
                            th:selected="${e} == *{engine}"
                            th:text="${e}"
                            th:value="${e}">
                        Engine type
                    </option>
                </select>
                <p class="invalid-feedback errors alert alert-danger">
                    Engine type is required.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label class="text-center text-white font-weight-bold" for="transmission">Transmission</label>
                <select
                        class="form-control"
                        id="transmission"
                        th:errorclass="is-invalid"
                        th:field="*{transmission}">
                    <option value="">- Select transmission type -</option>
                    <option th:each="e : ${T(bg.softuni.mobilelele.model.enums.TransmissionEnum).values()}"
                            th:selected="${e} == *{transmission}"
                            th:text="${e}"
                            th:value="${e}">
                        Transmission type
                    </option>
                </select>
                <p class="invalid-feedback errors alert alert-danger">
                    Transmission type is required.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="year">Year</label>
                <input
                        class="form-control"
                        id="year"
                        max="2099"
                        min="1900"
                        placeholder="Manufacturing year"
                        step="1"
                        th:errorclass="is-invalid"
                        th:field="*{year}"
                        type="number"/>
                <p class="invalid-feedback errors alert alert-danger">
                    Manufacturing year is required.
                </p>
            </div>
            <div class="form-group col-md-6 mb-3">
                <label class="text-white font-weight-bold" for="mileage">Mileage</label>
                <input
                        class="form-control"
                        id="mileage"
                        max="900000"
                        min="0"
                        placeholder="Mileage in kilometers"
                        step="1000"
                        th:errorclass="is-invalid"
                        th:field="*{mileage}"
                        type="number"/>
                <p class="invalid-feedback errors alert alert-danger">
                    Mileage in kilometers is required.
                </p>
            </div>
        </div>

        <div class="form-group">
            <label class="text-white font-weight-bold" for="description">Description</label>
            <textarea
                    class="form-control"
                    id="description"
                    placeholder="Description"
                    rows="3"
                    th:errorclass="is-invalid" th:field="*{description}"
                    type="textarea"></textarea>
            <p class="invalid-feedback errors alert alert-danger">
                Description is required.
            </p>
        </div>
        <div class="form-group">
            <label class="text-white font-weight-bold" for="imageUrl">Image URL</label>
            <input
                    class="form-control"
                    id="imageUrl"
                    placeholder="Put vehicle image URL here"
                    th:errorclass="is-invalid"
                    th:field="*{imageUrl}"
                    type="url">
            <p class="invalid-feedback errors alert alert-danger">
                Vehicle image URL is required.
            </p>
        </div>

        <div class="row">
            <div class="col col-md-4">
                <div class="button-holder d-flex">
                    <input class="btn btn-info btn-lg" type="submit" value="Update Offer"/>
                </div>
            </div>
        </div>
    </form>
</div>

<div>
    <footer></footer>
</div>

</body>
</html>
