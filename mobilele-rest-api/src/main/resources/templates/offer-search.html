<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MobiLeLeLe</title>
    <link href="/css/reset-css.css" rel="stylesheet"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet" type="text/css"/>
    <script src="/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>

<body>

<div th:replace="fragments/navbar">Navbar</div>
<div class="container">
    <h2 class="text-center text-white">Search for offers</h2>
    <form
            class="form-inline"
            style="justify-content: center; margin-top: 50px;"
            th:action="@{/offers/search}"
            th:method="GET"
            th:object="${searchOfferModel}"
    >
        <div style="position: relative">
            <input
                    aria-label="Search"
                    class="form-control mr-sm-2"
                    id="model"
                    placeholder="Model name..."
                    style="width: 280px;"
                    th:errorclass="is-invalid"
                    th:field="*{model}"
                    type="search"
            />
            <input
                    aria-label="Search"
                    class="form-control mr-sm-2"
                    id="minPrice"
                    placeholder="Min price..."
                    style="width: 280px;"
                    th:errorclass="is-invalid"
                    th:field="*{minPrice}"
                    type="search"
            />
            <input
                    aria-label="Search"
                    class="form-control mr-sm-2"
                    id="maxPrice"
                    placeholder="Max price..."
                    style="width: 280px;"
                    th:errorclass="is-invalid"
                    th:field="*{maxPrice}"
                    type="search"
            />
            <small
                    class="bg-danger text-light rounded invalid-feedback"
                    id="searchOfferHelpInline"
                    style="width: 97%; position: absolute; padding: 3px 15px; text-align: center;"
            >
                Try writing something this time.
            </small>
        </div>
        <button class="btn btn-outline-info my-2 my-sm-0" type="submit">Search</button>
    </form>
</div>

<div class="offers row mx-auto d-flex flex-row justify-content-center" style="margin-top: 40px;">

    <div class="offer card col-sm-6 col-md-3  col-lg-2 m-1 p-0" th:each="offer: ${offers}">
        <div class="card-img-top-wrapper">
            <img alt="Car image" class="card-img-top" th:src="${offer.imageUrl}">
        </div>
        <div class="card-body pb-1">
            <h5 class="card-title" th:text="${offer.getOfferHighlight}"></h5>
        </div>
        <ul class="offer-details list-group list-group-flush">
            <li class="list-group-item">
                <div class="card-text"><span th:text="'Mileage: ' + ${offer.mileage} + ' km'"></span></div>
                <div class="card-text"><span th:text="'Price: ' + ${offer.price} + ' lv'"></span></div>
                <div class="card-text"><span th:text="'Engine: ' + ${offer.engine}"></span></div>
                <div class="card-text"><span th:text="'Transmission: ' + ${offer.transmission}"></span></div>
            </li>
        </ul>
        <div class="card-body">
            <a class="card-link" href="#" th:href="@{/offers/{offerId}(offerId=${offer.id})}">Details</a>
        </div>
    </div>
    <h3 class="text-info" th:if="${offers != null && offers.size == 0}">There are no offers with this model yet</h3>
</div>

<div>
    <footer></footer>
</div>

</body>
</html>
