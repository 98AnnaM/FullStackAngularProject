<!DOCTYPE html>
<html lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <a class="navbar-brand" href="/"><img alt="car picture"
                                              class="logo"
                                              th:src="@{/images/car.png}">
        </a>
        <button aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"
                class="navbar-toggler"
                data-target="#navbarSupportedContent" data-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto col-12 justify-content-between">
                <li class="nav-item">
                    <a class="nav-link" href="/offers/search" th:text="#{navbar_search}">Search</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/brands/all" th:text="#{navbar_all_brands}">All Brands</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/offers/add" th:text="#{navbar_add_offer}">Add Offer</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/offers/all" th:text="#{navbar_all_offers}">All Offers</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a aria-expanded="false" aria-haspopup="true" class="nav-link dropdown-toggle"
                       data-toggle="dropdown"
                       href="/" id="navbarDropdown" role="button">
                        Admin
                    </a>
                    <div aria-labelledby="navbarDropdown" class="dropdown-menu">
                        <a class="dropdown-item" th:href="@{/statistics}">Statistics</a>
                    </div>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <div class="form-inline my-2 my-lg-0 px-3">
                        <div class="logged-user"
                             th:text="#{registration_subject(${#authentication.principal.fullName})}">
                        </div>
                        <form th:action="@{/users/logout}" th:method="post">
                            <input class="btn btn-link nav-link" th:value="#{navbar_logout}" type="submit">
                        </form>
                    </div>
                </li>
                <th:block sec:authorize="!isAuthenticated()">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users/register}" th:text="#{navbar_register}">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users/login}" th:text="#{navbar_login}">Login</a>
                    </li>
                </th:block>
                <li class="nav-item">
                    <form th:method="get">
                        <label class="text-white" for="lang" th:text="#{navbar_language}"></label>
                        <select
                                id="lang"
                                name="lang"
                                onchange="this.form.submit()">
                            <option th:selected="${#locale.toString()} == 'en_US'" value="en_US">English</option>
                            <option th:selected="${#locale.toString()} == 'bg_BG'" value="bg_BG">Български</option>
                        </select>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

</div>

</body>
</html>
